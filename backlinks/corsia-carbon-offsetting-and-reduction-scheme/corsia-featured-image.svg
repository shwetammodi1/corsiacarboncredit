<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#13315c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- flight arc between two "States" -->
  <path d="M170 700 Q800 140 1430 700" fill="none" stroke="#8da9c4" stroke-width="4" stroke-dasharray="14 12"/>
  <circle cx="170" cy="700" r="16" fill="#eef4ed"/>
  <circle cx="1430" cy="700" r="16" fill="#eef4ed"/>
  <text x="170" y="752" fill="#eef4ed" font-size="26" text-anchor="middle">State A</text>
  <text x="1430" y="752" fill="#eef4ed" font-size="26" text-anchor="middle">State B</text>

  <!-- aircraft silhouette at top of arc -->
  <g transform="translate(800 420) rotate(0)" fill="#eef4ed">
    <path d="M-90 0 L60 -6 Q95 -6 100 0 Q95 6 60 6 L-90 0 Z"/>
    <path d="M10 -4 L-25 -70 L-5 -70 L40 -4 Z"/>
    <path d="M10 4 L-25 70 L-5 70 L40 4 Z"/>
    <path d="M-75 -2 L-92 -30 L-80 -30 L-60 -2 Z"/>
    <path d="M-75 2 L-92 30 L-80 30 L-60 2 Z"/>
  </g>

  <!-- title -->
  <text x="800" y="120" fill="#eef4ed" font-size="64" font-weight="700" text-anchor="middle">CORSIA Explained</text>
  <text x="800" y="175" fill="#8da9c4" font-size="30" text-anchor="middle">Carbon Offsetting and Reduction Scheme for International Aviation (ICAO)</text>

  <!-- four-step strip -->
  <g font-size="24" text-anchor="middle">
    <g transform="translate(260 560)">
      <rect x="-150" y="-45" width="300" height="90" rx="14" fill="#134074" stroke="#8da9c4" stroke-width="2"/>
      <text y="-6" fill="#eef4ed" font-weight="700">1. Monitor</text>
      <text y="26" fill="#c9d6e3">fuel use &amp; CO₂</text>
    </g>
    <g transform="translate(620 560)">
      <rect x="-150" y="-45" width="300" height="90" rx="14" fill="#134074" stroke="#8da9c4" stroke-width="2"/>
      <text y="-6" fill="#eef4ed" font-weight="700">2. Report</text>
      <text y="26" fill="#c9d6e3">annually to the State</text>
    </g>
    <g transform="translate(980 560)">
      <rect x="-150" y="-45" width="300" height="90" rx="14" fill="#134074" stroke="#8da9c4" stroke-width="2"/>
      <text y="-6" fill="#eef4ed" font-weight="700">3. Verify</text>
      <text y="26" fill="#c9d6e3">independent check</text>
    </g>
    <g transform="translate(1340 560)">
      <rect x="-150" y="-45" width="300" height="90" rx="14" fill="#1b998b" stroke="#a8e6cf" stroke-width="2"/>
      <text y="-6" fill="#ffffff" font-weight="700">4. Offset</text>
      <text y="26" fill="#e8fff6">cancel eligible units</text>
    </g>
  </g>

  <text x="800" y="850" fill="#8da9c4" font-size="22" text-anchor="middle">Pilot Phase 2021–2023  ·  First Phase 2024–2026  ·  Second Phase 2027–2035</text>
</svg>
