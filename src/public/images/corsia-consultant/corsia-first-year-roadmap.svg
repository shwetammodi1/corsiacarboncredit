<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 446" width="920" height="446" role="img">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
  </defs>
  <rect width="920" height="446" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">A CORSIA first year, month by month</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">The monitoring plan must be approved before the year it covers begins</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0b25a"/></marker></defs><rect x="40" y="100" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="40" y="100" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="70" cy="131" r="14" fill="#e0b25a" opacity="0.18"/><text x="70" y="136" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">1</text><text x="94" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Scope and threshold assessment</text><text x="94" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Which entity, which flights, above or below 10,000 t</text><path d="M230,162 L230,178" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="178" width="380" height="62" rx="12" fill="#143027" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="40" y="178" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="70" cy="209" r="14" fill="#8cc79c" opacity="0.18"/><text x="70" y="214" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2</text><text x="94" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Data readiness review</text><text x="94" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Test the method against a real sample month</text><path d="M230,240 L230,256" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="256" width="380" height="62" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="256" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="287" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="292" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">3</text><text x="94" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Draft the monitoring plan</text><text x="94" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Method, sources, roles, gap procedures</text><path d="M230,318 L230,334" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="334" width="380" height="62" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="334" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="365" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="370" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">4</text><text x="94" y="360" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Submit to DGCA for approval</text><text x="94" y="379" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Allow time for questions and revision</text><rect x="480" y="100" width="380" height="62" rx="12" fill="#143027" stroke="#c7b98f" stroke-opacity="0.55"/><rect x="480" y="100" width="5" height="62" rx="3" fill="#c7b98f"/><circle cx="510" cy="131" r="14" fill="#c7b98f" opacity="0.18"/><text x="510" y="136" fill="#c7b98f" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">5</text><text x="534" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Build the data pipeline</text><text x="534" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Reconciliation rules written down, not informal</text><path d="M670,162 L670,178" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="178" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="480" y="178" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="510" cy="209" r="14" fill="#e0b25a" opacity="0.18"/><text x="510" y="214" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">6</text><text x="534" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Monitor and reconcile monthly</text><text x="534" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Catch problems in month two, not month twelve</text><path d="M670,240 L670,256" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="256" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="480" y="256" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="510" cy="287" r="14" fill="#e0b25a" opacity="0.18"/><text x="510" y="292" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">7</text><text x="534" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Compile the Annual Emissions Report</text><text x="534" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">From a maintained dataset, not a scramble</text><path d="M670,318 L670,334" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="334" width="380" height="62" rx="12" fill="#143027" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="480" y="334" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="510" cy="365" r="14" fill="#8cc79c" opacity="0.18"/><text x="510" y="370" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">8</text><text x="534" y="360" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Verification and submission</text><text x="534" y="379" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Verifier engaged early, findings resolved</text>
  <rect x="0.5" y="0.5" width="919" height="445" rx="18" fill="none" stroke="#1a3a30"/>
</svg>
