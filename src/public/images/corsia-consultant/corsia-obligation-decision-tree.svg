<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
  </defs>
  <rect width="960" height="432" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Which CORSIA obligations apply to an operator?</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Monitoring and offsetting are separate tests — do not conflate them</text>
  <defs><marker id="arw2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0b25a"/></marker></defs><rect x="40" y="217" width="250" height="56" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.7"/><text x="58" y="241" fill="#f4f0e6" font-size="13" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Aeroplane operator with</text><text x="58" y="259" fill="#f4f0e6" font-size="13" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">international flights</text><path d="M290,245 C290,245 290,128 330,128" fill="none" stroke="#8cc79c" stroke-opacity="0.55" stroke-width="2"/><rect x="330" y="100" width="200" height="56" rx="12" fill="#143027" stroke="#8cc79c" stroke-opacity="0.6"/><text x="346" y="133" fill="#8cc79c" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Under the emissions threshold</text><path d="M530,128 L560,128" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw2)"/><rect x="560" y="100" width="360" height="56" rx="12" fill="#8cc79c" opacity="0.13"/><text x="576" y="125" fill="#f4f0e6" font-size="13" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Limited or no MRV duty</text><text x="576" y="143" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Confirm against the current threshold and aircraft mass rule</text><path d="M290,245 C290,245 290,206 330,206" fill="none" stroke="#d98a66" stroke-opacity="0.55" stroke-width="2"/><rect x="330" y="178" width="200" height="56" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.6"/><text x="346" y="211" fill="#d98a66" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Above threshold</text><path d="M530,206 L560,206" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw2)"/><rect x="560" y="178" width="360" height="56" rx="12" fill="#d98a66" opacity="0.13"/><text x="576" y="203" fill="#f4f0e6" font-size="13" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Monitor, report and verify annually</text><text x="576" y="221" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Applies regardless of offsetting duty</text><path d="M290,245 C290,245 290,284 330,284" fill="none" stroke="#d98a66" stroke-opacity="0.55" stroke-width="2"/><rect x="330" y="256" width="200" height="56" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.6"/><text x="346" y="289" fill="#d98a66" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Both states on a route pair participate</text><path d="M530,284 L560,284" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw2)"/><rect x="560" y="256" width="360" height="56" rx="12" fill="#d98a66" opacity="0.13"/><text x="576" y="281" fill="#f4f0e6" font-size="13" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Offsetting requirement applies to that pair</text><text x="576" y="299" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Route-pair test, not operator nationality</text><path d="M290,245 C290,245 290,362 330,362" fill="none" stroke="#c7b98f" stroke-opacity="0.55" stroke-width="2"/><rect x="330" y="334" width="200" height="56" rx="12" fill="#143027" stroke="#c7b98f" stroke-opacity="0.6"/><text x="346" y="367" fill="#c7b98f" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">One state not participating</text><path d="M530,362 L560,362" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw2)"/><rect x="560" y="334" width="360" height="56" rx="12" fill="#c7b98f" opacity="0.13"/><text x="576" y="359" fill="#f4f0e6" font-size="13" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">No offsetting for that pair, MRV still applies</text><text x="576" y="377" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Track the participating-state list each year</text>
  <rect x="0.5" y="0.5" width="959" height="431" rx="18" fill="none" stroke="#1a3a30"/>
</svg>
