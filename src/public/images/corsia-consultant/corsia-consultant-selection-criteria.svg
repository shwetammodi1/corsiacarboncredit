<text x="48" y="378" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Deliverables</text><text x="281.68" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Named documents, dates, acceptance criteria</text><text x="632.21" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Scope described as &quot;support&quot;</text><rect x="36" y="100" width="888" height="294" rx="8" fill="none" stroke="#1a3a30"/>
