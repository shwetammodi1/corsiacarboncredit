<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" role="img">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
  </defs>
  <rect width="960" height="434" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">How CORSIA differs by operator type</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Same rules, very different practical burden</text>
  <rect x="36" y="100" width="888" height="42" rx="8" fill="#e0b25a" opacity="0.16"/><text x="48" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Operator type</text><text x="288" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Main difficulty</text><text x="648" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Typical obligation</text><rect x="36" y="142" width="888" height="42" fill="#143027" opacity="0.75"/><text x="48" y="168" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Scheduled passenger</text><text x="288" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Data volume and reconciliation</text><text x="648" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Large, predictable</text><text x="48" y="210" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Cargo / freighter</text><text x="288" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Charter legs and ad hoc routing</text><text x="648" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Moderate, variable</text><rect x="36" y="226" width="888" height="42" fill="#143027" opacity="0.75"/><text x="48" y="252" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Business aviation</text><text x="288" y="252" fill="#d98a66" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Threshold uncertainty</text><text x="648" y="252" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Small or none</text><text x="48" y="294" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Charter / ACMI</text><text x="288" y="294" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Which entity is the operator</text><text x="648" y="294" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Depends on the certificate</text><rect x="36" y="310" width="888" height="42" fill="#143027" opacity="0.75"/><text x="48" y="336" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">New entrant</text><text x="288" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">No baseline history</text><text x="648" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Grows with the network</text><text x="48" y="378" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Regional / UDAN</text><text x="288" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Mostly domestic, little in scope</text><text x="648" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Often below threshold</text><rect x="36" y="100" width="888" height="294" rx="8" fill="none" stroke="#1a3a30"/>
  <rect x="0.5" y="0.5" width="959" height="433" rx="18" fill="none" stroke="#1a3a30"/>
