<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c5646"/></marker>
  </defs>
  <rect width="920" height="440" rx="18" fill="url(#bgg)"/>
  
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">CORSIA vs the voluntary carbon market</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Two markets, different rules and buyers</text>
  <rect x="40" y="100" width="400" height="40" rx="10" fill="#10261f" stroke="#8cc79c" stroke-opacity="0.6"/><text x="240" y="126" fill="#8cc79c" font-size="14" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">CORSIA (compliance)</text><rect x="480" y="100" width="400" height="40" rx="10" fill="#10261f" stroke="#c7b98f" stroke-opacity="0.6"/><text x="680" y="126" fill="#c7b98f" font-size="14" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">Voluntary market</text><rect x="40" y="154" width="400" height="44" rx="9" fill="#10261f" stroke="#22473b" stroke-opacity="0.5"/><text x="56" y="182" fill="#c9d0c4" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Airlines must comply</text><rect x="480" y="154" width="400" height="44" rx="9" fill="#10261f" stroke="#2c5646" stroke-opacity="0.55"/><text x="496" y="182" fill="#c7b98f" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Buyers choose to act</text><rect x="40" y="208" width="400" height="44" rx="9" fill="#10261f" stroke="#22473b" stroke-opacity="0.5"/><text x="56" y="236" fill="#c9d0c4" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Only ICAO-approved units</text><rect x="480" y="208" width="400" height="44" rx="9" fill="#10261f" stroke="#2c5646" stroke-opacity="0.55"/><text x="496" y="236" fill="#c7b98f" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Any credible standard</text><rect x="40" y="262" width="400" height="44" rx="9" fill="#10261f" stroke="#22473b" stroke-opacity="0.5"/><text x="56" y="290" fill="#c9d0c4" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Corresponding adjustment</text><rect x="480" y="262" width="400" height="44" rx="9" fill="#10261f" stroke="#2c5646" stroke-opacity="0.55"/><text x="496" y="290" fill="#c7b98f" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Adjustment often optional</text><rect x="40" y="316" width="400" height="44" rx="9" fill="#10261f" stroke="#22473b" stroke-opacity="0.5"/><text x="56" y="344" fill="#c9d0c4" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Fixed annual obligation</text><rect x="480" y="316" width="400" height="44" rx="9" fill="#10261f" stroke="#2c5646" stroke-opacity="0.55"/><text x="496" y="344" fill="#c7b98f" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Flexible, self-defined goals</text><rect x="40" y="370" width="400" height="44" rx="9" fill="#10261f" stroke="#22473b" stroke-opacity="0.5"/><text x="56" y="398" fill="#c9d0c4" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Retired to meet a duty</text><rect x="480" y="370" width="400" height="44" rx="9" fill="#10261f" stroke="#2c5646" stroke-opacity="0.55"/><text x="496" y="398" fill="#c7b98f" font-size="12.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Retired for claims / ESG</text>
  <rect x="0.5" y="0.5" width="919" height="439" rx="18" fill="none" stroke="#1a3a30"/>
</svg>