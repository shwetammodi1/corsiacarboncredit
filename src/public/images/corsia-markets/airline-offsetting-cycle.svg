<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c5646"/></marker>
  </defs>
  <rect width="920" height="440" rx="18" fill="url(#bgg)"/>
  
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">An airline’s annual CORSIA cycle</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">What an operator does between January and the following year</text>
  
  <rect x="40" y="100" width="400" height="60" rx="12" fill="#10261f" stroke="#8cc79c" stroke-opacity="0.55"/>
  <rect x="40" y="100" width="5" height="60" rx="3" fill="#8cc79c"/>
  <circle cx="70" cy="130" r="14" fill="#8cc79c" opacity="0.18"/>
  <text x="70" y="135" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">1</text>
  <text x="94" y="125" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Monitor flights</text>
  <text x="94" y="144" fill="#c9d0c4" font-size="11.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Fuel burn on covered international routes</text>
  <rect x="40" y="174" width="400" height="60" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/>
  <rect x="40" y="174" width="5" height="60" rx="3" fill="#d98a66"/>
  <circle cx="70" cy="204" r="14" fill="#d98a66" opacity="0.18"/>
  <text x="70" y="209" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
  <text x="94" y="199" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Report emissions</text>
  <text x="94" y="218" fill="#c9d0c4" font-size="11.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Verified emissions report to the state</text>
  <rect x="40" y="248" width="400" height="60" rx="12" fill="#10261f" stroke="#e0b25a" stroke-opacity="0.55"/>
  <rect x="40" y="248" width="5" height="60" rx="3" fill="#e0b25a"/>
  <circle cx="70" cy="278" r="14" fill="#e0b25a" opacity="0.18"/>
  <text x="70" y="283" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">3</text>
  <text x="94" y="273" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Receive offsetting requirement</text>
  <text x="94" y="292" fill="#c9d0c4" font-size="11.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Calculated by ICAO for the period</text>
  <rect x="480" y="100" width="400" height="60" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/>
  <rect x="480" y="100" width="5" height="60" rx="3" fill="#d98a66"/>
  <circle cx="510" cy="130" r="14" fill="#d98a66" opacity="0.18"/>
  <text x="510" y="135" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">4</text>
  <text x="534" y="125" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Procure units and claim fuels</text>
  <text x="534" y="144" fill="#c9d0c4" font-size="11.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Buy CEUs, deduct eligible fuel use</text>
  <rect x="480" y="174" width="400" height="60" rx="12" fill="#10261f" stroke="#c7b98f" stroke-opacity="0.55"/>
  <rect x="480" y="174" width="5" height="60" rx="3" fill="#c7b98f"/>
  <circle cx="510" cy="204" r="14" fill="#c7b98f" opacity="0.18"/>
  <text x="510" y="209" fill="#c7b98f" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">5</text>
  <text x="534" y="199" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Cancel and record</text>
  <text x="534" y="218" fill="#c9d0c4" font-size="11.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">Retire units in registries, keep evidence</text>
  <rect x="0.5" y="0.5" width="919" height="439" rx="18" fill="none" stroke="#1a3a30"/>
</svg>