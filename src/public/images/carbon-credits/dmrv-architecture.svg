  <rect width="920" height="440" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">How digital MRV works</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Replaces periodic manual survey with continuous evidence</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c5646"/></marker></defs><rect x="40" y="100" width="380" height="62" rx="12" fill="#10261f" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="40" y="100" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="70" cy="131" r="14" fill="#8cc79c" opacity="0.18"/><text x="70" y="136" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">1</text><text x="94" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Sensors and devices</text><text x="94" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Stove use, flow meters, soil probes, meters</text><path d="M230,162 L230,178" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="178" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="178" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="209" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="214" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2</text><text x="94" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Data transmission</text><text x="94" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Cellular, LoRa or manual sync where offline</text><path d="M230,240 L230,256" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="256" width="380" height="62" rx="12" fill="#10261f" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="40" y="256" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="70" cy="287" r="14" fill="#e0b25a" opacity="0.18"/><text x="70" y="292" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">3</text><text x="94" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Validation layer</text><text x="94" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Range, plausibility and tamper checks</text><rect x="480" y="100" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="480" y="100" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="510" cy="131" r="14" fill="#d98a66" opacity="0.18"/><text x="510" y="136" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">4</text><text x="534" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Storage with audit trail</text><text x="534" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Immutable record of what was measured when</text><path d="M670,162 L670,178" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="178" width="380" height="62" rx="12" fill="#10261f" stroke="#c7b98f" stroke-opacity="0.55"/><rect x="480" y="178" width="5" height="62" rx="3" fill="#c7b98f"/><circle cx="510" cy="209" r="14" fill="#c7b98f" opacity="0.18"/><text x="510" y="214" fill="#c7b98f" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">5</text><text x="534" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Calculation engine</text><text x="534" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Methodology applied automatically</text><path d="M670,240 L670,256" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="256" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="480" y="256" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="510" cy="287" r="14" fill="#d98a66" opacity="0.18"/><text x="510" y="292" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">6</text><text x="534" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Verifier access</text><text x="534" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Read-only view of the underlying evidence</text>
