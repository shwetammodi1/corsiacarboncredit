      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
  </defs>
  <rect width="920" height="560" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">The life of a carbon credit</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">From project concept to a retired or cancelled unit</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c5646"/></marker></defs><rect x="40" y="100" width="380" height="62" rx="12" fill="#10261f" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="40" y="100" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="70" cy="131" r="14" fill="#8cc79c" opacity="0.18"/><text x="70" y="136" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">1</text><text x="94" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Project concept</text><text x="94" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">An activity that reduces or removes emissions</text><path d="M230,162 L230,178" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="178" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="178" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="209" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="214" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2</text><text x="94" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Methodology selection</text><text x="94" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Under a chosen crediting standard</text><path d="M230,240 L230,256" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="256" width="380" height="62" rx="12" fill="#10261f" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="40" y="256" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="70" cy="287" r="14" fill="#e0b25a" opacity="0.18"/><text x="70" y="292" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">3</text><text x="94" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Project design document</text><text x="94" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Baseline, additionality, monitoring plan</text><path d="M230,318 L230,334" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="334" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="334" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="365" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="370" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">4</text><text x="94" y="360" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Validation</text><text x="94" y="379" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Independent check of the design before registration</text><path d="M230,396 L230,412" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="412" width="380" height="62" rx="12" fill="#10261f" stroke="#c7b98f" stroke-opacity="0.55"/><rect x="40" y="412" width="5" height="62" rx="3" fill="#c7b98f"/><circle cx="70" cy="443" r="14" fill="#c7b98f" opacity="0.18"/><text x="70" y="448" fill="#c7b98f" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">5</text><text x="94" y="438" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Registration</text><text x="94" y="457" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Project listed on the standard registry</text><rect x="480" y="100" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="480" y="100" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="510" cy="131" r="14" fill="#d98a66" opacity="0.18"/><text x="510" y="136" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">6</text><text x="534" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Monitoring</text><text x="534" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Data collected over a defined period</text><path d="M670,162 L670,178" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="178" width="380" height="62" rx="12" fill="#10261f" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="480" y="178" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="510" cy="209" r="14" fill="#8cc79c" opacity="0.18"/><text x="510" y="214" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">7</text><text x="534" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Verification</text><text x="534" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Independent check that reductions occurred</text><path d="M670,240 L670,256" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="256" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="480" y="256" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="510" cy="287" r="14" fill="#d98a66" opacity="0.18"/><text x="510" y="292" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">8</text><text x="534" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Issuance</text><text x="534" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Serialised credits created in the registry</text><path d="M670,318 L670,334" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="334" width="380" height="62" rx="12" fill="#10261f" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="480" y="334" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="510" cy="365" r="14" fill="#e0b25a" opacity="0.18"/><text x="510" y="370" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">9</text><text x="534" y="360" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Transfer</text><text x="534" y="379" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Sold to a buyer or intermediary</text><path d="M670,396 L670,412" stroke="#2c5646" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="412" width="380" height="62" rx="12" fill="#10261f" stroke="#d98a66" stroke-opacity="0.55"/><rect x="480" y="412" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="510" cy="443" r="14" fill="#d98a66" opacity="0.18"/><text x="510" y="448" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">10</text><text x="534" y="438" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Retirement or cancellation</text><text x="534" y="457" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Permanently removed; the claim is made</text>
  <rect x="0.5" y="0.5" width="919" height="559" rx="18" fill="none" stroke="#1a3a30"/>
