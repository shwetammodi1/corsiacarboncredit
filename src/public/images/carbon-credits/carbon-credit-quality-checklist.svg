<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 518" width="960" height="518" role="img">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
  </defs>
  <rect width="960" height="518" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">What makes a carbon credit high quality</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">The questions to ask before you transact, in order of how often they fail</text>
  <rect x="36" y="100" width="888" height="42" rx="8" fill="#8cc79c" opacity="0.16"/><text x="48" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Test</text><text x="288" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">What you are asking</text><text x="612" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Fails when</text><rect x="36" y="142" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="168" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Additionality</text><text x="288" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Would this have happened anyway?</text><text x="612" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Already profitable or legally required</text><text x="48" y="210" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Baseline</text><text x="288" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Is the counterfactual credible?</text><text x="612" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Overstated deforestation or usage rates</text><rect x="36" y="226" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="252" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Quantification</text><text x="288" y="252" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Conservative and measurable?</text><text x="612" y="252" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Optimistic default assumptions</text><text x="48" y="294" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Permanence</text><text x="288" y="294" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Can the reduction reverse?</text><text x="612" y="294" fill="#d98a66" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Buffer sized to historic risk</text><rect x="36" y="310" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="336" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Double counting</text><text x="288" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Claimed by anyone else?</text><text x="612" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">No corresponding adjustment</text><text x="48" y="378" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Verification</text><text x="288" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Independently checked?</text><text x="612" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Qualified opinion, or none</text><rect x="36" y="394" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="420" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Safeguards</text><text x="288" y="420" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Any social or environmental harm?</text><text x="612" y="420" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Land tenure disputes</text><text x="48" y="462" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Traceability</text><text x="288" y="462" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Serialised and trackable?</text><text x="612" y="462" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Buyer records, not the registry</text><rect x="36" y="100" width="888" height="378" rx="8" fill="none" stroke="#1a3a30"/>
  <rect x="0.5" y="0.5" width="959" height="517" rx="18" fill="none" stroke="#1a3a30"/>
</svg>
