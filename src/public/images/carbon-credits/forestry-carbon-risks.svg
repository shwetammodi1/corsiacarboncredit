      <stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#143027"/>
    </linearGradient>
  </defs>
  <rect width="960" height="434" rx="18" fill="url(#bgg)"/>
  <text x="36" y="46" fill="#f4f0e6" font-size="21" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Risks specific to forestry carbon projects</text>
  <text x="36" y="70" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Each has a standard mitigation; none is fully eliminated</text>
  <rect x="36" y="100" width="888" height="42" rx="8" fill="#8cc79c" opacity="0.16"/><text x="48" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Risk</text><text x="288" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">What happens</text><text x="624" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Usual mitigation</text><rect x="36" y="142" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="168" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Reversal</text><text x="288" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Fire, disease, drought or logging</text><text x="624" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Buffer pool contribution</text><text x="48" y="210" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Leakage</text><text x="288" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Deforestation shifts elsewhere</text><text x="624" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Leakage deduction</text><rect x="36" y="226" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="252" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Baseline inflation</text><text x="288" y="252" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Projected loss overstated</text><text x="624" y="252" fill="#8cc79c" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Jurisdictional baselines</text><text x="48" y="294" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Tenure dispute</text><text x="288" y="294" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Communities not properly consented</text><text x="624" y="294" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">FPIC and grievance process</text><rect x="36" y="310" width="888" height="42" fill="#10261f" opacity="0.75"/><text x="48" y="336" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Over-crediting</text><text x="288" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">More issued than achieved</text><text x="624" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Conservative quantification</text><text x="48" y="378" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Impermanence at scale</text><text x="288" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Buffer undersized for climate risk</text><text x="624" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Periodic buffer reassessment</text><rect x="36" y="100" width="888" height="294" rx="8" fill="none" stroke="#1a3a30"/>
  <rect x="0.5" y="0.5" width="959" height="433" rx="18" fill="none" stroke="#1a3a30"/>
