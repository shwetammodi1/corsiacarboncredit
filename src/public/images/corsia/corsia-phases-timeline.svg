<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="CORSIA phases and what each one requires">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10261f"/><stop offset="100%" stop-color="#143027"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="920" height="400" rx="16" fill="url(#bgG)"/>
  
  
  <text x="28" y="38" fill="#f4f0e6" font-size="19" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">CORSIA phases and what each one requires</text>
  <text x="28" y="60" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Monitoring and reporting apply to all operators; offsetting obligations phase in by period</text>
  <line x1="90" y1="210" x2="830" y2="210" stroke="#e0b25a" stroke-width="2"/><circle cx="90" cy="210" r="11" fill="#10261f" stroke="#e0b25a" stroke-width="3"/><text x="90" y="176" fill="#e0b25a" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Baseline</text><text x="90" y="156" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2019-2020</text><text x="90" y="244" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Emissions baseline</text><text x="90" y="261" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">established</text><circle cx="336.67" cy="210" r="11" fill="#10261f" stroke="#8cc79c" stroke-width="3"/><text x="336.67" y="176" fill="#8cc79c" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Pilot Phase</text><text x="336.67" y="156" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2021-2023</text><text x="336.67" y="244" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Voluntary participation</text><text x="336.67" y="261" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">offsetting begins</text><circle cx="583.33" cy="210" r="11" fill="#10261f" stroke="#d98a66" stroke-width="3"/><text x="583.33" y="176" fill="#d98a66" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">First Phase</text><text x="583.33" y="156" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2024-2026</text><text x="583.33" y="244" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Voluntary participation</text><text x="583.33" y="261" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">sectoral growth factor</text><circle cx="830" cy="210" r="11" fill="#10261f" stroke="#d98a66" stroke-width="3"/><text x="830" y="176" fill="#d98a66" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Second Phase</text><text x="830" y="156" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2027-2035</text><text x="830" y="244" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">Mandatory for most</text><text x="830" y="261" fill="#c9d0c4" font-size="11" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">ICAO Member States</text>
  <rect x="0.5" y="0.5" width="919" height="399" rx="16" fill="none" stroke="#1a3a30"/>
</svg>
