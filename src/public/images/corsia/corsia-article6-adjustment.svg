<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="How a corresponding adjustment prevents double counting">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10261f"/><stop offset="100%" stop-color="#143027"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="920" height="440" rx="16" fill="url(#bgG)"/>
  
  
  <text x="28" y="38" fill="#f4f0e6" font-size="19" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">How a corresponding adjustment prevents double counting</text>
  <text x="28" y="60" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Without the host State giving up the tonne in its own accounts, the unit is not eligible</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0b25a"/></marker></defs><rect x="40" y="100" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="40" y="100" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="70" cy="131" r="14" fill="#e0b25a" opacity="0.18"/><text x="70" y="136" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">1</text><text x="94" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Project reduces emissions</text><text x="94" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">One tonne of CO2 avoided or removed</text><path d="M230,162 L230,178" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="178" width="380" height="62" rx="12" fill="#143027" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="40" y="178" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="70" cy="209" r="14" fill="#8cc79c" opacity="0.18"/><text x="70" y="214" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2</text><text x="94" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Units issued in a registry</text><text x="94" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Serialised under an approved programme</text><path d="M230,240 L230,256" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="256" width="380" height="62" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="256" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="287" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="292" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">3</text><text x="94" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Developer requests authorisation</text><text x="94" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">To the host State designated authority</text><rect x="480" y="100" width="380" height="62" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.55"/><rect x="480" y="100" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="510" cy="131" r="14" fill="#d98a66" opacity="0.18"/><text x="510" y="136" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">4</text><text x="534" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Host State authorises</text><text x="534" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">For international use under Article 6</text><path d="M670,162 L670,178" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="178" width="380" height="62" rx="12" fill="#143027" stroke="#c7b98f" stroke-opacity="0.55"/><rect x="480" y="178" width="5" height="62" rx="3" fill="#c7b98f"/><circle cx="510" cy="209" r="14" fill="#c7b98f" opacity="0.18"/><text x="510" y="214" fill="#c7b98f" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">5</text><text x="534" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Adjustment applied</text><text x="534" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Tonne added back to the host national inventory</text><path d="M670,240 L670,256" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="256" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="480" y="256" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="510" cy="287" r="14" fill="#e0b25a" opacity="0.18"/><text x="510" y="292" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">6</text><text x="534" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Operator cancels the unit</text><text x="534" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Only one party now claims the reduction</text>
  <rect x="0.5" y="0.5" width="919" height="439" rx="16" fill="none" stroke="#1a3a30"/>
</svg>
