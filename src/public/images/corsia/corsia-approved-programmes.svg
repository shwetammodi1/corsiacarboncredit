<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 476" width="920" height="476" role="img" aria-label="ICAO-approved crediting programmes">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10261f"/><stop offset="100%" stop-color="#143027"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="920" height="476" rx="16" fill="url(#bgG)"/>
  
  
  <text x="28" y="38" fill="#f4f0e6" font-size="19" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">ICAO-approved crediting programmes</text>
  <text x="28" y="60" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Approval is granted by the ICAO Council on TAB recommendation and is reviewed periodically</text>
  <rect x="36" y="100" width="848" height="42" rx="8" fill="#e0b25a" opacity="0.16"/><text x="48" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Programme</text><text x="373.07" y="126" fill="#f4f0e6" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Focus</text><rect x="36" y="142" width="848" height="42" fill="#143027" opacity="0.75"/><text x="48" y="168" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">American Carbon Registry (ACR)</text><text x="373.07" y="168" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Broad methodology range, US origin</text><text x="48" y="210" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Architecture for REDD+ Transactions</text><text x="373.07" y="210" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Jurisdictional forest carbon (TREES)</text><rect x="36" y="226" width="848" height="42" fill="#143027" opacity="0.75"/><text x="48" y="252" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Climate Action Reserve (CAR)</text><text x="373.07" y="252" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">North American project types</text><text x="48" y="294" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Global Carbon Council (GCC)</text><text x="373.07" y="294" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Gulf region origin, broad scope</text><rect x="36" y="310" width="848" height="42" fill="#143027" opacity="0.75"/><text x="48" y="336" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Verra (VCS)</text><text x="373.07" y="336" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Largest voluntary standard by issued volume</text><text x="48" y="378" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Gold Standard</text><text x="373.07" y="378" fill="#c9d0c4" font-size="12" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Community and SDG-linked projects</text><rect x="36" y="394" width="848" height="42" fill="#143027" opacity="0.75"/><text x="48" y="420" fill="#f4f0e6" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Others, status changes</text><text x="373.07" y="420" fill="#d98a66" font-size="12" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Always verify the current ICAO list before transacting</text><rect x="36" y="100" width="848" height="336" rx="8" fill="none" stroke="#1a3a30"/>
  <rect x="0.5" y="0.5" width="919" height="475" rx="16" fill="none" stroke="#1a3a30"/>
</svg>
