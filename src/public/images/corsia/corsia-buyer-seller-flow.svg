<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="How a CORSIA credit moves from project to cancellation">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10261f"/><stop offset="100%" stop-color="#143027"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="920" height="520" rx="16" fill="url(#bgG)"/>
  
  
  <text x="28" y="38" fill="#f4f0e6" font-size="19" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">How a CORSIA credit moves from project to cancellation</text>
  <text x="28" y="60" fill="#c9d0c4" font-size="13" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">The chain a unit passes through before it can offset an operator obligation</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0b25a"/></marker></defs><rect x="40" y="100" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="40" y="100" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="70" cy="131" r="14" fill="#e0b25a" opacity="0.18"/><text x="70" y="136" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">1</text><text x="94" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Project developed</text><text x="94" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Under an ICAO-approved crediting programme</text><path d="M230,162 L230,178" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="178" width="380" height="62" rx="12" fill="#143027" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="40" y="178" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="70" cy="209" r="14" fill="#8cc79c" opacity="0.18"/><text x="70" y="214" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">2</text><text x="94" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Validation and registration</text><text x="94" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Methodology applied, project registered</text><path d="M230,240 L230,256" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="256" width="380" height="62" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="256" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="287" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="292" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">3</text><text x="94" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Monitoring and verification</text><text x="94" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Independent verification of the reductions</text><path d="M230,318 L230,334" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="40" y="334" width="380" height="62" rx="12" fill="#143027" stroke="#d98a66" stroke-opacity="0.55"/><rect x="40" y="334" width="5" height="62" rx="3" fill="#d98a66"/><circle cx="70" cy="365" r="14" fill="#d98a66" opacity="0.18"/><text x="70" y="370" fill="#d98a66" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">4</text><text x="94" y="360" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Units issued</text><text x="94" y="379" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Serialised credits in the programme registry</text><rect x="480" y="100" width="380" height="62" rx="12" fill="#143027" stroke="#c7b98f" stroke-opacity="0.55"/><rect x="480" y="100" width="5" height="62" rx="3" fill="#c7b98f"/><circle cx="510" cy="131" r="14" fill="#c7b98f" opacity="0.18"/><text x="510" y="136" fill="#c7b98f" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">5</text><text x="534" y="126" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Eligibility labelling</text><text x="534" y="145" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Vintage, host-State authorisation, no double counting</text><path d="M670,162 L670,178" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="178" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="480" y="178" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="510" cy="209" r="14" fill="#e0b25a" opacity="0.18"/><text x="510" y="214" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">6</text><text x="534" y="204" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Sale to operator or intermediary</text><text x="534" y="223" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Bilateral, broker or exchange</text><path d="M670,240 L670,256" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="256" width="380" height="62" rx="12" fill="#143027" stroke="#e0b25a" stroke-opacity="0.55"/><rect x="480" y="256" width="5" height="62" rx="3" fill="#e0b25a"/><circle cx="510" cy="287" r="14" fill="#e0b25a" opacity="0.18"/><text x="510" y="292" fill="#e0b25a" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">7</text><text x="534" y="282" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Transfer to operator account</text><text x="534" y="301" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Registry-to-registry movement</text><path d="M670,318 L670,334" stroke="#e0b25a" stroke-width="1.5" marker-end="url(#arw)"/><rect x="480" y="334" width="380" height="62" rx="12" fill="#143027" stroke="#8cc79c" stroke-opacity="0.55"/><rect x="480" y="334" width="5" height="62" rx="3" fill="#8cc79c"/><circle cx="510" cy="365" r="14" fill="#8cc79c" opacity="0.18"/><text x="510" y="370" fill="#8cc79c" font-size="13" font-weight="700" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" opacity="1">8</text><text x="534" y="360" fill="#f4f0e6" font-size="14" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Cancellation for CORSIA</text><text x="534" y="379" fill="#c9d0c4" font-size="11.5" font-weight="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" opacity="1">Retired against the offsetting requirement</text>
  <rect x="0.5" y="0.5" width="919" height="519" rx="16" fill="none" stroke="#1a3a30"/>
</svg>
